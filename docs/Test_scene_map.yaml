
TestEntry:
    Dialogue
        narrator
            There are three signs:
            Left to the gate
            Forward to the ogre
            Right to the hermit
    Choices
        Go left
            // Go to: WarriorsGate
        Go straight
            // Go to: OgresGate
        Go right
            // Go to: HermistHovel

WarriorsGate:
    Dialogue
        narrator
            The gate needs a key to open
    Choies
        Use the hermit's key on the gate
            // CONDITION: HasItem("warriors-gate-key") == true
            // Go to: WarriorsAbode
        Go back to the crossroads
            // Go to: TestEntry

OgresGate:
