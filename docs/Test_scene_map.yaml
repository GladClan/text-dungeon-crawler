WarriorsAbode:
    Dialogue
        narrator
            A stark place, definitely home to a man.
            Sparsely furbished, I mean.
        Warrior
            The ogre awaits.
            You have the coin?
            I don't.
            I believe the hermit may be hiding some. He owes me.
    Choices
        Bring the warrior along
            // CONDITION: MemberInParty(Warrior) == false
            // EFFECT:
                // ChangeTitle("Go left", "Go to the warrior's abode")
                // AddMemberToParty(Warrior)
            // Go to: TestEntry
        Go back to the crossroads

GetTheKey:
    Dialogue
        Hermit
            Here it is, here it is.
            I only hid it as a joke, you see? A prank of no consequence.
        narrator
            The hermit looks rather uncomfortable.
        Hermit
            Okay, you got me...
            I owe him a couple coins...
            Okay, a lot of money.
            I have it hereabouts, I'm just sad to part with it.
    Choices
        Stay awhile
            // Go to: HermitsHovel
        Go back to the crossroads

GetTheGold:
    Dialogue
        Hermit
            Okay, alright.
            Here ya go.
        narrator
            He reaches in a spot you would never think to look.
            It's quite a stack of coins.
            But you wonder if that's all he has to give.
    Choices
        Stay awhile
        Go back to the crossroads

OgresGateway:
    Dialogue
        narrator
            The gate swings open at your approach, and your money pouch feels the lost weight of missing coins.
            That was indeed a steep price.
            You hear a bellow from beyond.
            It seems the challenger awaits you.
    Choices
        Accept the ogre's challenge
            // Go to: OgreFight
        Go back to the crossroads

HermitsGift:
    Condition
        // Skill check: persuasion(difficulty = medium) == success
    IfNotMetRequirements
        // Go to: HermitGiftNotGiven
    Dialogue
        Hermit
            Well... I do have one final prize for ye.
            I was holdin it in case the time came that I found a worthy champion of me own.
            But you might profit from it more than I, I see.
        narrator
            He offers you a choice of three things:
            A weapon.
            A helmet.
            Or a scroll.
    Choices
        Take the weapon
            // EFFECT: 
                // GiveItem("polearm-ogre-slayer")      // naginata: powerful against ogres
                // HermitGifted = true
            // Go to: YouGotAThing
        Take the helmet
            // EFFECT:
