HermitGiftNotGiven:
    Dialogue
        Hermit
            Well...
            I'd rather not part with it.
            No, I think not.
        narrator
            The hermit turns away.
            It seems he wants to help, but he's unconvinced.
            Perhaps you can try again later.
    Choices
        Stay awhile
        Go back to the crossroads

YouGotAThing:
    Dialogue
        Hermit
            Well there ya go. Best off be goin.
    Choices
        Stay awhile
        Go back to the crossroads

OgreFight:
    Dialogue
        narrator
            The gate swings swiftly shut behind you
            Ahead of you is the beast, scarred and mindless, with a swarth of minions about him.
            He approaches, prepare yourself!
    Choices
        The ogre attacks. Defens yourself!
            // Fight Ogre and goblin minions
            // [OnBattleEnd]
                // Go to: BattleWon

BattleWon:
    Dialogue
        narrator
            That was quite that battle.
            Or perhaps it wasn't, I was in fact not paying attention... sorry.
            Well, there's one last path to take.
            The orge had some treasure.
    Choices
        Investigate the stacks of gems
            // Go to: GemPile

GemPile:
    Dialogue
        narrator
            There is a stack of gems.
            Some of them are enchanted, you can see.
            On further investigation, the rest are glass, though the enchanted gems look more plain.
            Take them?
    Choices
        What a prize!
            // EFFECT:
                // GiveItemsArray(["life-gem", "healing-gem", "fortify-gem", "mana-gem"])
            // Go to: PrincessTower

PrincessTower:
    Dialogue
        narrator
            But it doesn't end there.
            The warrior keeps going past, as if he sees a far better prize.
            He is moving towards a tower ahead, and at the top you can just see a window.
            There is a lady poking her head out of the window, waving at the knight.
            It seems he's found his prize, too.
    // End
